# The one check of every push to main (jig open-feature-pr, Straight to main):
# lint, typecheck, build and the full suite. The suites run
# on PGlite, so the job needs no database and no secret.
name: ci

on:
  push:
    branches: [main]

# No concurrency group: builders push from parallel worktrees, and each one
# waits for the run of its own commit. A group for the branch with
# cancel-in-progress made each push, and each re-run, cancel another
# builder's run. Never add one to this workflow.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  # The full suite. Each matrix entry is one machine: `args` goes to
  # `turbo run test:run`. A job that reaches its time limit shows as
  # cancelled, so a suite that takes more than 5 minutes on one machine is
  # split, never given a higher limit: one entry for the other packages
  # (`--filter=!{{SCOPE}}/<app>`) and one entry for each shard of the slow one
  # (`--filter={{SCOPE}}/<app> -- --shard=1/4` to `--shard=4/4`).
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run test:run --concurrency=1 ${{ matrix.args }}
