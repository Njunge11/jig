# The one check of every push to main (jig open-feature-pr, Straight to main):
# lint, typecheck, build and the full suite. The suites run
# on PGlite, so the job needs no database and no secret.
name: ci

on:
  push:
    branches: [main]

# No concurrency group: builders push from parallel worktrees, and each one
# waits for the run of its own commit. A group for the branch with
# cancel-in-progress made each push, and each re-run, cancel another
# builder's run. Never add one to this workflow.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
